[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/hw_probe",
    "crates/fit_engine",
    "crates/catalog",
    "crates/downloader",
    "crates/library",
    "crates/server_manager",
    "crates/gateway",
    "src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["LLM Advisor Team"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
domain = { path = "crates/domain" }
hw_probe = { path = "crates/hw_probe" }
fit_engine = { path = "crates/fit_engine" }
catalog = { path = "crates/catalog" }
downloader = { path = "crates/downloader" }
library = { path = "crates/library" }
server_manager = { path = "crates/server_manager" }
gateway = { path = "crates/gateway" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.16"
wiremock = "0.6"
plist = "1.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

