name: Automated Catalog Sync

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual triggering from GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Catalog Verifier & Sync
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 scripts/update-catalog.py --online

      - name: Commit and push if catalog changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/catalog/catalog.json
          if git diff --staged --quiet; then
            echo "No changes in catalog."
          else
            git commit -m "chore(catalog): auto-sync model catalog from Hugging Face Hub"
            git push
          fi
