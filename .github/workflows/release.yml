name: Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            target: 'x86_64-unknown-linux-gnu'
            args: '--verbose'
          - platform: 'macos-15-intel'
            target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2t64 \
            cmake \
            clang \
            libcurl4

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch pinned sidecar binary & dependencies
        shell: bash
        run: bash ./scripts/fetch-sidecar.sh

      - name: Set AppImage library path (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/src-tauri/binaries:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Build Tauri Application & Package Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'ModelSift v__VERSION__'
          releaseBody: 'See attached platform assets for download. Report any issues at https://github.com/yoel3imari/modelsift/issues'
          releaseDraft: true
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          retryAttempts: 3
          args: ${{ matrix.args }}

      - name: Verify glibc floor matches installer requirement
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/llm-advisor src-tauri/binaries/llama-server src-tauri/binaries/*.so)
          declared="$(grep -oE '^MIN_GLIBC="[0-9]+\.[0-9]+"' install.sh | cut -d'"' -f2)"
          if [ -z "${declared}" ]; then
            echo "::warning::MIN_GLIBC not found in install.sh; skipping glibc floor verification."
            exit 0
          fi
          required=""
          for f in "${files[@]}"; do
            [ -e "${f}" ] || continue
            v="$(objdump -T "${f}" 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -Vu | tail -n1)"
            [ -n "${v}" ] || continue
            if [ -z "${required}" ] || [ "$(printf '%s\n%s\n' "${required}" "${v}" | sort -V | tail -n1)" = "${v}" ]; then
              required="${v}"
            fi
          done
          if [ -z "${required}" ]; then
            echo "::warning::No binaries found to measure; skipping glibc floor verification."
            exit 0
          fi
          echo "Highest glibc requirement in build: ${required}; installer declares: ${declared}"
          if [ "$(printf '%s\n%s\n' "${declared}" "${required}" | sort -V | tail -n1)" != "${declared}" ]; then
            echo "::error::Build requires glibc ${required}, but install.sh advertises ${declared}."
            echo "Bump MIN_GLIBC (and the README/AGENTS.md floors) or pin the runner image before publishing this release."
            exit 1
          fi

      - name: Verify macOS floor matches installer requirement
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          declared="$(grep -oE '^MIN_MACOS="[0-9]+\.[0-9]+"' install.sh | cut -d'"' -f2)"
          if [ -z "${declared}" ]; then
            echo "::warning::MIN_MACOS not found in install.sh; skipping check."
            exit 0
          fi
          bundle="$(jq -r '.bundle.macOS.minimumSystemVersion' src-tauri/tauri.conf.json)"
          echo "install.sh MIN_MACOS=${declared}; bundle minimumSystemVersion=${bundle}"
          if [ "${bundle}" != "${declared}" ]; then
            echo "::error::macOS floor mismatch: tauri.conf.json declares ${bundle}, install.sh advertises ${declared}."
            exit 1
          fi
